[package]
name = "bluetooth-input-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"
default-run = "bluetooth-input-desktop"

[lib]
name = "bluetooth_input_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "bluetooth-input-desktop"
path = "src/main.rs"

[[bin]]
name = "bluetooth-input-bridge-service"
path = "src/bin/bridge-service.rs"

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"
zvariant = "5.15.1"
evdev = "0.13.2"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 后端：Win32 WinSock 蓝牙 RFCOMM（AF_BTH + WSASetService）+ SendInput 注入
# + 命名管道控制通道。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
