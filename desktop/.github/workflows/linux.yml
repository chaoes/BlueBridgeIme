name: Linux desktop

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: cargo build (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install WebKitGTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build desktop shell and headless service
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins

      - name: Run protocol unit tests
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-input-bridge-linux-x86_64
          path: |
            src-tauri/target/release/bluetooth-input-desktop
            src-tauri/target/release/bluetooth-input-bridge-service
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bluetooth-input-bridge-linux-x86_64
          path: dist

      - name: Package tarball
        run: |
          chmod +x dist/bluetooth-input-desktop dist/bluetooth-input-bridge-service
          tar -C dist -czf bluetooth-input-bridge-linux-x86_64.tar.gz \
            bluetooth-input-desktop bluetooth-input-bridge-service

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bluetooth-input-bridge-linux-x86_64.tar.gz
          generate_release_notes: true