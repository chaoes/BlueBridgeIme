name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 默认的 `packages: 'tools platform-tools'` 仍会执行 `sdkmanager tools`，
      # 而 SDK 仓库里早已没有 `tools` 包（Failed to find package 'tools'）。
      # 显式列出需要的包，顺带完成 SDK 许可证接受。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # 仓库 Secrets 里配了 ANDROID_KEYSTORE_BASE64 才会走 release 签名；
      # 否则（本地、fork PR）构建 debug APK，行为与以前一致。
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          NAME="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/bluetooth-input-bridge-${NAME}-release.apk"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，构建 debug APK"
            ./gradlew --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk \
               "dist/bluetooth-input-bridge-${NAME}-debug.apk"
          fi

      - name: Verify APK signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install WebKitGTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build desktop shell and headless service
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins

      - name: Run protocol unit tests
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/src-tauri/target/release/bluetooth-input-desktop
            desktop/src-tauri/target/release/bluetooth-input-bridge-service
          if-no-files-found: error
          retention-days: 30

# 桌面端的 LÖVE 版界面：官方运行时 + 我们的 .love，顺带给 Linux 包塞进服务二进制。
  love:
    name: LÖVE front-end
    needs: [desktop, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: love
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download service binary
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: love/dist/service

      # Windows 的 LÖVE 包里要放服务二进制和命名管道转接程序。
      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: love/dist/win

      - name: Package LÖVE builds
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.0.${GITHUB_RUN_NUMBER}"
          chmod +x package.sh
          ./package.sh "$VERSION" dist dist/service/bluetooth-input-bridge-service dist/win
          rm -rf dist/service dist/win

      - name: Upload LÖVE packages
        uses: actions/upload-artifact@v4
        with:
          name: love-builds
          path: |
            love/dist/*.love
            love/dist/*.zip
            love/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  desktop-deb:
    name: Debian package
    # 打标签和手动触发时构建；普通 push/PR 不跑，避免占用时间。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build release binaries
        run: cargo build --locked --release --bins --manifest-path src-tauri/Cargo.toml

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.0.${GITHUB_RUN_NUMBER}"
          bash packaging/deb/build.sh "$VERSION" amd64 "$PWD/dist"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  desktop-arch:
    name: Arch package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 \
            libsoup3 librsvg libevdev openssl pkgconf shadow

      - name: Check out
        uses: actions/checkout@v4

      # makepkg 拒绝以 root 运行，建个普通用户来打包。
      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.0.${GITHUB_RUN_NUMBER}"
          workdir="$GITHUB_WORKSPACE/desktop/packaging/arch"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$workdir/PKGBUILD"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd $workdir && makepkg -f --noconfirm"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-arch
          path: desktop/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  # Windows 后端：Win32 蓝牙 RFCOMM（AF_BTH + WSASetService）+ SendInput 文字注入，
  # 实现说明见 desktop/docs/windows.md；安装包由 tauri CLI 打成 NSIS。
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: |
          # tauri 的 NSIS 打包器会自己寻找 makensis；找不到就先装好，避免现场下载。
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
            'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Get-Command makensis.exe | Select-Object -ExpandProperty Source

      # 安装包由 tauri CLI 负责打包；界面二进制仍由下面的 cargo build 产出，
      # tauri 打包时不会重新编译 Rust，只把它和图标、钩子脚本一起塞进 NSIS。
      # 用 install-action 而不是 `cargo install tauri-cli`：前者直接下载预编译的官方二进制，
      # 后者要现场编译上百个依赖、好几分钟。
      - name: Set up Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build binaries
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins

      - name: Run unit tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      # 用 bundle 子命令而不是 build：build 会自己再跑一遍 cargo（前面的缓存和测试白费），
      # bundle 只打包“已经构建好的”release 二进制，这正是我们上一步的产物。
      # 前端的静态文件由 src-tauri/build.rs 复制到 generated-dist 并写入
      # TAURI_ENV_FRONTEND_DIST，所以不需要 beforeBuildCommand，也不需要额外的前端工具链。
      # 产物：src-tauri/target/release/bundle/nsis/*_<版本>_x64-setup.exe
      # 安装向导含“安装模式”“目录选择”两页，用户可以自己选安装（解压）位置。
      - name: Build installer
        run: cargo tauri bundle --bundles nsis --ci

      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe'
          if (-not $setup) {
            throw '没有生成 NSIS 安装包'
          }
          foreach ($file in $setup) {
            "{0}  {1:N0} 字节" -f $file.Name, $file.Length
          }
          # 复制一份带平台后缀的名字，Release 里好区分
          $suffix = ($env:GITHUB_REF_NAME -replace '/', '-')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $setup[0].FullName "dist/bluetooth-input-bridge-${suffix}-windows-x64-setup.exe"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/src-tauri/target/release/bluetooth-input-desktop.exe
            desktop/src-tauri/target/release/bluetooth-input-bridge-service.exe
            desktop/src-tauri/target/release/bluetooth-input-bridge-socket.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop, desktop-deb, desktop-arch, love, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p dist
          cp artifacts/android-apk/*.apk dist/
          cp artifacts/desktop-deb/*.deb dist/
          cp artifacts/desktop-arch/*.pkg.tar.zst dist/
          cp artifacts/love-builds/*.love artifacts/love-builds/*.zip artifacts/love-builds/*.tar.gz dist/
          cp artifacts/desktop-linux/bluetooth-input-desktop \
             artifacts/desktop-linux/bluetooth-input-bridge-service dist/
          cp artifacts/desktop-windows-installer/*.exe dist/
          chmod +x dist/bluetooth-input-desktop dist/bluetooth-input-bridge-service
          (cd dist && tar -czf bluetooth-input-bridge-linux-x86_64.tar.gz \
             bluetooth-input-desktop bluetooth-input-bridge-service)
          (cd dist && sha256sum *.apk *.tar.gz *.deb *.pkg.tar.zst *.zip *.love *.exe > SHA256SUMS.txt)
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/*.zip
            dist/*.love
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true