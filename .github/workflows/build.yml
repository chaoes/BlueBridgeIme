name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 默认的 `packages: 'tools platform-tools'` 仍会执行 `sdkmanager tools`，
      # 而 SDK 仓库里早已没有 `tools` 包（Failed to find package 'tools'）。
      # 显式列出需要的包，顺带完成 SDK 许可证接受。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # 仓库 Secrets 里配了 ANDROID_KEYSTORE_BASE64 才会走 release 签名；
      # 否则（本地、fork PR）构建 debug APK，行为与以前一致。
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          NAME="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/bluetooth-input-bridge-${NAME}-release.apk"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，构建 debug APK"
            ./gradlew --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk \
               "dist/bluetooth-input-bridge-${NAME}-debug.apk"
          fi

      - name: Verify APK signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install WebKitGTK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build desktop shell and headless service
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins

      - name: Run protocol unit tests
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/src-tauri/target/release/bluetooth-input-desktop
            desktop/src-tauri/target/release/bluetooth-input-bridge-service
          if-no-files-found: error
          retention-days: 30

# 桌面端的 LÖVE 版界面：官方运行时 + 我们的 .love，顺带给 Linux 包塞进服务二进制。
  love:
    name: LÖVE front-end
    needs: [desktop]
    # 只在打标签（或手动触发）时出包（Windows 二进制来自 windows 作业的产物）。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: love
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download service binary
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: love/dist/service

      # Windows 的 LÖVE 包里要放服务二进制和命名管道转接程序。
      # Windows 包要带上服务与 socket 桥（artifact 由 windows 作业上传）。
      # 放在这里而不是 needs 里：Windows 作业跑挂了也不该拖住其余平台的发布，
      # 拿不到就跳过，只是少一个 zip。
      # 不能先下载再等：download-artifact 在产物还没上传时直接失败，之后也不会重试，
      # 所以轮询这同一个步骤，每次失败都吞掉，直到两个 exe 都拿到（最多 20 分钟）。
      - name: Wait for Windows binaries
        id: win
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: love/dist/win
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      # download-artifact@v4 在产物还没上传时直接失败，之后不再重试，所以再单独轮询一次，
      # 每次失败都吞掉，直到两个 exe 都拿到（最多 20 分钟）。
      - name: Retry Windows binaries
        if: always()
        shell: bash
        run: |
          dir=dist/win
          for i in $(seq 1 40); do
            if [ -f "$dir/bluetooth-input-bridge-service.exe" ] && [ -f "$dir/bluetooth-input-bridge-socket.exe" ]; then
              echo "拿到 Windows 二进制"
              exit 0
            fi
            sleep 10
            ( cd "$GITHUB_WORKSPACE/love" && gh run download "$GITHUB_RUN_ID" -n desktop-windows -D dist/win ) || true
          done
          echo "提示：没等到 Windows 二进制，只出其余平台的包"
          exit 0

      - name: Package LÖVE builds
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.1.${GITHUB_RUN_NUMBER}"
          chmod +x package.sh
          ./package.sh "$VERSION" dist dist/service/bluetooth-input-bridge-service dist/win
          rm -rf dist/service dist/win

      - name: Upload LÖVE packages
        uses: actions/upload-artifact@v4
        with:
          name: love-builds
          path: |
            love/dist/*.love
            love/dist/*.zip
            love/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  desktop-deb:
    name: Debian package
    # 打标签和手动触发时构建；普通 push/PR 不跑，避免占用时间。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        id: deps
        continue-on-error: true
        run: |
          sudo apt-get update
          # gcc-mingw-w64-x86-64：交叉编 Windows（GNU 目标）时 cc-rs / rustc 要用 dlltool、windres。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev pkg-config \
            gcc-mingw-w64-x86-64 nsis \
            llvm lld clang cabextract wget unzip

      # apt 偶发 429/网络抖动时不要整包失败：缺的库下面那步会逐个报出来。
      - name: Verify dependencies
        run: |
          status=0
          for dep in libssl-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64 nsis; do
            if ! dpkg -s "$dep" >/dev/null 2>&1; then
              echo "::error title=missing dependency::$dep 没装上（apt 步骤可能因为网络失败，见 ${{ steps.deps.outcome }}）"
              status=1
            fi
          done
          pkg-config --modversion gtk+-3.0 openssl 2>&1 || true
          command -v makensis && makensis -VERSION || true
          exit $status

      # tauri 交叉打 NSIS 包时会去找 makensis.exe：Linux 的 Ubuntu 包把它装在
      # /usr/bin/makensis（NSIS 3.x），这里补一个 .exe 名字的入口，省得去装别的东西。
      - name: Provide makensis.exe
        run: |
          makensis_path=$(command -v makensis || true)
          if [ -z "$makensis_path" ]; then
            echo "::error title=makensis missing::apt 没装上 nsis，打不出安装包"
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$makensis_path" "$HOME/.local/bin/makensis.exe"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/makensis.exe" -VERSION

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # msvc：交叉打出 NSIS 安装包（GNU 目标在 Linux 上打不出安装包）。
          # gnu：再编一份免安装的 portable exe 一起发布。
          targets: "x86_64-pc-windows-msvc,x86_64-pc-windows-gnu"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build release binaries
        run: cargo build --locked --release --bins --manifest-path src-tauri/Cargo.toml

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.1.${GITHUB_RUN_NUMBER}"
          bash packaging/deb/build.sh "$VERSION" amd64 "$PWD/dist"
      # Linux 上没有 Windows 的库，必须用 --no-bundle 先给出 target 目录，再只打 NSIS。
      # 两步分开是为了在注解里直接看到是哪一步失败（job 日志要管理员权限才拉得到）。
      # 用轻量 runner 上的 config-rs 试错期：pkg-config 报错、cargo tauri 不存在之类的问题
      # 一律先打进注解（不中断），打不出安装包就当没有——apk / Linux / LÖVE 包照常发布。
      # 之前这里只有探测、没有安装，`cargo tauri` 自然是 no such command。
      # install-action 直接拿官方预编译二进制，不现场编译上百个依赖。
      - name: Set up Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Probe Tauri toolchain
        continue-on-error: true
        run: |
          which pkg-config; pkg-config --version
          for m in openssl gtk+-3.0 libsoup-3.0 webkit2gtk-4.1; do
            if pkg-config --exists "$m" 2>/dev/null; then
              echo "$m = $(pkg-config --modversion "$m")"
            else
              echo "::warning title=pkg-config::missing $m"
            fi
          done
          ( command -v cargo-tauri && cargo tauri --version ) || echo '::warning title=cargo-tauri::not installed'
          exit 0
      # tauri 自己会再跑一遍 cargo，而它默认把产物写到 target-tauri，和上面的
      # `cargo build --release --bins`（rust-cache 缓存的就是 target/）完全不是一份，
      # 等于整包重编一遍；这里显式指到同一目录复用缓存。
      - name: Prepare Windows target
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$PWD/src-tauri/target"
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld
          # tauri-winres 在 Linux 上写资源（图标 / 版本信息）要调 llvm-rc；cc-rs 的 Windows 目标检测
          # 只看 CC_<target>，给个 clang 让它走 llvm 那套（rc.exe / windres 在 Linux 上都没有）。
          export CC_x86_64_pc_windows_msvc=clang
          LLVM_BIN=$(dirname "$(ls -d /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -n 1)" 2>/dev/null || true)
          if [ -n "$LLVM_BIN" ] && [ -d "$LLVM_BIN" ]; then
            export PATH="$LLVM_BIN:$PATH"
          else
            echo '::warning title=llvm-rc::没找到 llvm-rc，资源编译可能失败'
          fi
          command -v llvm-rc || true
          # ---- Windows SDK 头文件 + 导入库 ----
          # 微软把 CRT 编译进静态库时需要 SDK 头（windows.h 等）与 MSVC 导入库；Linux 上没有，
          # 这里用 xwin 的 split 布局把它们装到本地 <target>/xwin/splat/cache/<xwin 版本>/{crt,sdk}/，
          # 再把这两个目录作为 -L native= 交给 rust-lld。
          (
            repo=https://github.com/Jake-Shadle/xwin
            tag=$(curl -fsSL "https://api.github.com/repos/Jake-Shadle/xwin/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
            [ -n "$tag" ] || tag=v0.6.5
            url="$repo/releases/download/${tag}/xwin-${tag}-x86_64-unknown-linux-musl.tar.gz"
            echo "xwin: $url"
            mkdir -p "$HOME/.local/xwin-bin"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C "$HOME/.local/xwin-bin"
            ls -l "$HOME/.local/xwin-bin"
            "$HOME/.local/xwin-bin/xwin" --accept-license --arch x86_64 \
            splat --output "$CARGO_TARGET_DIR/xwin"
          ) 2>&1 | tail -n 40
          XWIN_PATHS=$(find "$CARGO_TARGET_DIR/xwin" -mindepth 2 -maxdepth 2 -type d \( -name 'crt' -o -name 'sdk' \) 2>/dev/null | sort | tr '\n' ' ')
          echo "xwin paths: ${XWIN_PATHS:-none}"
          if [ -z "$XWIN_PATHS" ]; then
            echo '::error title=xwin::没能准备 Windows SDK（看上面 xwin 的输出）'
            exit 1
          fi
          SDK_FLAGS="$(for d in $XWIN_PATHS; do printf -- '-L native=%s ' "$d"; done)"
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="$SDK_FLAGS"
          echo "rustflags: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS"
          # rust-lld 读取的是 MSVC 风格 /LIBPATH:，用 `-L native=` 交给 rustc 拼出来即可。
          LLVM_ENV='__CARGO_TEST_LLVM_LIB(=)=true'
          status=0
          env "$LLVM_ENV" cargo tauri build --target x86_64-pc-windows-msvc --no-bundle 2>&1 |
            tee ../tauri-prep.log || status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 交叉打包失败时日志只留在 runner 上，没人看得到——把最后几十行打成注解，直接在页面上显示。
            tail -n 40 ../tauri-prep.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=tauri build::${line:0:900}"
            done
            exit "$status"
          fi

      - name: Build Windows installer
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$PWD/src-tauri/target"
          export RUST_BACKTRACE=1
          # 交叉打包用 x86_64-pc-windows-msvc：GNU 目标虽然能编出 exe，但在 Linux 上
          # tauri-bundler 会在 `Target: x64` 之后直接报 `No such file or directory (os error 2)`
          # （Windows 链接器的资源/图标链在 GNU 目标下走不通），换回 msvc + rust-lld 可稳定出包装好。
          run_bundle() {
            cargo tauri bundle --bundles nsis "$@" --target x86_64-pc-windows-msvc 2>&1 |
              tee ../tauri-nsis.log
            return ${PIPESTATUS[0]}
          }
          run_bundle --ci && echo 'bundle ok'
          # 再用 GNU 目标编一份免安装的 exe（不装程序的人直接解压跑）。
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          status=0
          cargo build --locked --release --bins \
            --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-gnu 2>&1 | tee ../tauri-gnu.log || status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 ../tauri-gnu.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=portable build::${line:0:900}"
            done
          fi

      - name: Upload bundle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-log
          path: tauri-nsis.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect Windows installer
        run: |
          mkdir -p dist
          src=$(ls src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo "::warning title=no installer::交叉打包没产出 setup.exe，见 windows-installer-log 产物"
            exit 0
          fi
          cp "$src" "dist/bluetooth-input-bridge-${GITHUB_REF_NAME#v}-windows-x64-setup.exe"
          gnu=src-tauri/target/x86_64-pc-windows-gnu/release/bluetooth-input-desktop.exe
          if [ -f "$gnu" ]; then
            cp "$gnu" "dist/bluetooth-input-bridge-${GITHUB_REF_NAME#v}-windows-x64-portable.exe"
          else
            echo "::warning title=no portable::没有产出免安装 exe"
          fi
          ls -l dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  desktop-arch:
    name: Arch package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 \
            libsoup3 librsvg libevdev openssl pkgconf shadow

      - name: Check out
        uses: actions/checkout@v4

      # makepkg 拒绝以 root 运行，建个普通用户来打包。
      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.2.1.${GITHUB_RUN_NUMBER}"
          workdir="$GITHUB_WORKSPACE/desktop/packaging/arch"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$workdir/PKGBUILD"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd $workdir && makepkg -f --noconfirm"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-arch
          path: desktop/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  # Windows 后端：Win32 蓝牙 RFCOMM（AF_BTH + WSASetService）+ SendInput 文字注入，
  # 实现说明见 desktop/docs/windows.md；安装包由 tauri CLI 打成 NSIS。
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # 安装包（NSIS）改在 linux 的 Debian 作业里打，Windows 这里只负责编译与自检。
      # install-action 没有 tauri-cli 的预编译包时会退回到 cargo-binstall，再退回到源码编译，
      # 一次要十几分钟；直接下官方 release 的二进制，几秒钟的事。
      - name: Set up Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build binaries
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins

      # 单独一步构建测试（等价于 cargo test --no-run），下面直接跑产出的可执行文件：
      # cargo test 会把失败详情写进组日志，注解里看不到。
      - name: Build unit tests
        run: cargo test --locked --no-run --manifest-path src-tauri/Cargo.toml --lib

      # 失败用例逐个输出成工作流注解：默认的 job 日志要管理员权限才拉得到，
      # 而失败详情只出现在组日志里时，注解里就只剩一句 "exit code 1"。
      # 顺带把休眠不唤醒的问题暴露出来——并行跑到一半卡死，只会看到超时。
      - name: Run unit tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'unit-tests.log'
          $exe = (Get-ChildItem -Recurse -Path 'src-tauri/target/debug/deps' -Filter '*.exe' |
            Where-Object { $_.BaseName -like 'bluetooth_input_desktop_lib-*' -and $_.BaseName -ne 'bluetooth_input_desktop_lib' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1)
          if (-not $exe) { throw '没有找到测试可执行文件（先跑 cargo test --no-run）' }
          & $exe.FullName --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log |
              Where-Object { $_ -match 'FAILED' -or $_ -match '^test result:' } |
              Select-Object -First 20 |
              ForEach-Object {
                $text = $_.Trim()
                if ($text.Length -gt 600) { $text = $text.Substring(0, 600) }
                Write-Output "::error title=unit-tests failed::$text"
              }
          }
          exit $code

      # 测试日志单独上传：默认的 job 日志要管理员权限才拉得到，失败时至少有它可看。
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-tests
          path: ${{ runner.temp }}/unit-tests.log
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Release
    # 永远跑：Windows 安装包那一步挂掉也不该把 apk、Linux 包、LÖVE 包一起扣下。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    # 不列 desktop-deb：它的产物是 .deb 和 Windows 安装包，失败时不该挡住 apk / Linux / LÖVE 的发布。
    needs: [android, desktop, desktop-arch, love, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          # 每个产物单独取：某个作业没产出（例如 Windows 安装包没打出来）只少一个文件，
          # 不该把 apk、deb、Arch 包、LÖVE 包一起扣下。
          mkdir -p dist
          copy() {
            local pattern=$1
            if compgen -G "$pattern" > /dev/null; then
              cp $pattern dist/
            else
              echo "::warning title=missing artifact::没有找到 $pattern"
            fi
          }
          copy 'artifacts/android-apk/*.apk'
          copy 'artifacts/desktop-deb/*.deb'
          copy 'artifacts/desktop-arch/*.pkg.tar.zst'
          copy 'artifacts/love-builds/*.love'
          copy 'artifacts/love-builds/*.zip'
          copy 'artifacts/love-builds/*.tar.gz'
          copy 'artifacts/desktop-linux/bluetooth-input-desktop'
          copy 'artifacts/desktop-linux/bluetooth-input-bridge-service'
          copy 'artifacts/desktop-windows-installer/*.exe'
          chmod +x dist/bluetooth-input-desktop dist/bluetooth-input-bridge-service 2>/dev/null || true
          (cd dist && tar -czf bluetooth-input-bridge-linux-x86_64.tar.gz \
             bluetooth-input-desktop bluetooth-input-bridge-service)
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
             | sort | xargs -r sha256sum > SHA256SUMS.txt)
          ls -l dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/*.zip
            dist/*.love
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true