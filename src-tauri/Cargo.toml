[package]
name = "bluetooth-input-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "bluetooth-input-desktop"

[lib]
name = "bluetooth_input_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "bluetooth-input-desktop"
path = "src/main.rs"

[[bin]]
name = "bluetooth-input-bridge-service"
path = "src/bin/bridge-service.rs"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"
zvariant = "5.15.1"
evdev = "0.13.2"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2.7.4" }
